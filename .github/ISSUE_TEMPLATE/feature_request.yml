name: Feature request
description: Explain a useful workflow improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the person affected and the current workflow.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would a successful implementation let someone do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing workarounds or alternatives
